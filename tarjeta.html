<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de Marcadores — MindAR</title>

    <!-- A-Frame + MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #info {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: sans-serif;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 16px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="info">Esperando marcador...</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets/target.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Cámara -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Luz ambiente -->
      <a-entity light="type: ambient; intensity: 1"></a-entity>

      <!-- Texto 3D que se muestra sobre el marcador -->
      <a-entity id="textoMarcador" visible="false">
        <a-text
          id="textoAR"
          value=""
          color="#00ff00"
          align="center"
          position="0 0 -1"
          scale="1.8 1.8 1.8"
        ></a-text>
      </a-entity>

      <!-- Targets (cada marcador del archivo .mind) -->
      <a-entity mindar-image-target="targetIndex: 0" id="target0"></a-entity>
      <a-entity mindar-image-target="targetIndex: 1" id="target1"></a-entity>
      <a-entity mindar-image-target="targetIndex: 2" id="target2"></a-entity>
      <a-entity mindar-image-target="targetIndex: 3" id="target3"></a-entity>
      <a-entity mindar-image-target="targetIndex: 4" id="target4"></a-entity>
      <a-entity mindar-image-target="targetIndex: 5" id="target5"></a-entity>
    </a-scene>

    <script>
      const info = document.getElementById("info");
      const textoMarcador = document.getElementById("textoMarcador");
      const textoAR = document.getElementById("textoAR");

      const nombres = ["META", "MCDONALS", "NETFLIX", "NIKE", "ALPHABET", "APPLE"];
      const escena = document.querySelector("a-scene");

      escena.addEventListener("arReady", () => {
        console.log("✅ AR listo, cámara iniciada correctamente.");
      });

      // Registrar eventos para cada marcador individual
      for (let i = 0; i < nombres.length; i++) {
        const target = document.getElementById(`target${i}`);

        if (!target) continue; // Evita errores si no hay ese marcador

        target.addEventListener("targetFound", () => {
          const nombre = nombres[i];
          textoAR.setAttribute("value", `${nombre} DETECTADO`);
          textoMarcador.setAttribute("visible", "true");
          info.innerText = `Marcador detectado: ${nombre}`;
          console.log(`🎯 Marcador detectado: ${nombre}`);
        });

        // BONUS: mantener visible el último marcador detectado
        target.addEventListener("targetLost", () => {
          info.innerText = `Último marcador detectado: ${nombres[i]}`;
          textoMarcador.setAttribute("visible", "true"); // no se oculta
          console.log(`ℹ️ Marcador perdido: ${nombres[i]} (texto sigue visible)`);
        });
      }

      // Iniciar cámara automáticamente
      window.addEventListener("load", async () => {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          console.log("🎥 Permiso de cámara concedido");
        } catch (err) {
          console.error("❌ Error al acceder a la cámara:", err);
          alert("No se pudo acceder a la cámara. Revisa los permisos del navegador.");
        }
      });
    </script>
  </body>
</html>
