<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AR Compras Divertidas</title>

  <!-- Librerías principales -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }
    #brandInfo {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-weight: bold; display: none; z-index: 15;
    }
    #overlay {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 16px 20px;
      border-radius: 12px; display: none; text-align: center;
      box-shadow: 0 0 15px rgba(255,255,255,0.2); z-index: 15;
      width: 90%; max-width: 320px;
    }
    #overlay button {
      margin: 10px 8px 0; padding: 8px 14px; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    #btnYes { background: #28a745; color: white; }
    #btnNo { background: #dc3545; color: white; }
  </style>
</head>

<body>
  <div id="brandInfo">Apunta la cámara a un marcador</div>

  <div id="overlay">
    <div id="question">¿Quieres comprar este producto?</div>
    <div>
      <button id="btnYes">Sí, comprar</button>
      <button id="btnNo">No, gracias</button>
    </div>
    <div id="result" style="margin-top:10px; font-weight:bold;"></div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="antialias: true; colorManagement: true"
           arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
      <a-asset-item id="meta" src="./models/meta.glb"></a-asset-item>
      <a-asset-item id="alphabet" src="./models/alphabet.glb"></a-asset-item>
      <a-asset-item id="netflix" src="./models/netflix.glb"></a-asset-item>
      <a-asset-item id="nike" src="./models/nike.glb"></a-asset-item>
      <a-asset-item id="mcdonalds" src="./models/mcdonalds.glb"></a-asset-item>
      <a-asset-item id="apple" src="./models/COFRE_NEW_BLENDER.glb"></a-asset-item>
    </a-assets>

    <a-entity camera></a-entity>

    <!-- MARCADORES -->
    <a-marker type="pattern" id="marker-meta" url="./targets/marcadormeta.patt" emitevents="true">
      <a-entity id="model-meta" gltf-model="#meta" scale="0.5 0.5 0.5" visible="true" animation-mixer></a-entity>
    </a-marker>

    <a-marker type="pattern" id="marker-alphabet" url="./targets/marcadoralphabet.patt" emitevents="true">
      <a-entity id="model-alphabet" gltf-model="#alphabet" scale="0.5 0.5 0.5" visible="true" animation-mixer></a-entity>
    </a-marker>

    <a-marker type="pattern" id="marker-netflix" url="./targets/marcadornetflix.patt" emitevents="true">
      <a-entity id="model-netflix" gltf-model="#netflix" scale="0.5 0.5 0.5" visible="true" animation-mixer></a-entity>
    </a-marker>

    <a-marker type="pattern" id="marker-nike" url="./targets/marcadornike.patt" emitevents="true">
      <a-entity id="model-nike" gltf-model="#nike" scale="0.5 0.5 0.5" visible="true" animation-mixer></a-entity>
    </a-marker>

    <a-marker type="pattern" id="marker-mcdonalds" url="./targets/marcadormcdonalds.patt" emitevents="true">
      <a-entity id="model-mcdonalds" gltf-model="#mcdonalds" scale="0.5 0.5 0.5" visible="true" animation-mixer></a-entity>
    </a-marker>

    <a-marker type="pattern" id="marker-apple" url="./targets/apple.patt" emitevents="true">
      <a-entity id="model-apple" gltf-model="#apple" scale="0.5 0.5 0.5"
                visible="true" animation-mixer="loop: once; clampWhenFinished: true"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById("overlay");
    const question = document.getElementById("question");
    const result = document.getElementById("result");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");
    const brandInfo = document.getElementById("brandInfo");

    const markers = [
      { id: "marker-meta", name: "Meta" },
      { id: "marker-alphabet", name: "Alphabet" },
      { id: "marker-netflix", name: "Netflix" },
      { id: "marker-nike", name: "Nike" },
      { id: "marker-mcdonalds", name: "McDonald’s" },
      { id: "marker-apple", name: "Apple" }
    ];

    let currentBrand = null;
    let currentModel = null;
    let currentMixer = null;
    let currentAction = null;
    let clock = new THREE.Clock();
    let halfway = 0;
    let animationPaused = false;
    let lostTimeout = null;
    let needsReset = false;
    let smoothTarget = null;

    AFRAME.registerComponent("control-anim", {
      tick: function () {
        if (currentMixer && !animationPaused) {
          currentMixer.update(clock.getDelta());
        }
        if (currentModel && smoothTarget) {
          const currentPos = currentModel.object3D.position;
          currentPos.lerp(smoothTarget, 0.05);
        }
      }
    });

    document.querySelector("a-scene").setAttribute("control-anim", "");

    markers.forEach(({ id, name }) => {
      const marker = document.getElementById(id);
      const model = document.getElementById("model-" + id.split("marker-")[1]);

      marker.addEventListener("markerFound", () => {
        console.log(`✅ Marcador detectado: ${name}`);
        clearTimeout(lostTimeout);
        smoothTarget = null;
        model.setAttribute("visible", true);
        currentBrand = name;
        currentModel = model;
        brandInfo.textContent = `🔍 Empresa detectada: ${name}`;
        brandInfo.style.display = "block";
        question.textContent = `¿Quieres comprar ${name}?`;
        result.textContent = "";
        overlay.style.display = "block";

        const threeObj = model.object3D;
        if (threeObj && threeObj.children.length > 0) {
          const gltfScene = threeObj.children[0];
          if (gltfScene.animations && gltfScene.animations.length > 0) {
            const mixer = new THREE.AnimationMixer(gltfScene);
            const action = mixer.clipAction(gltfScene.animations[0]);
            action.reset();
            action.setLoop(THREE.LoopOnce);
            action.clampWhenFinished = true;
            action.play();
            currentMixer = mixer;
            currentAction = action;
            clock.start();
            animationPaused = false;
            halfway = action.getClip().duration / 2;

            const checkHalf = setInterval(() => {
              if (currentMixer && currentAction && currentAction.time >= halfway) {
                animationPaused = true;
                clock.stop();
                clearInterval(checkHalf);
                console.log(`⏸ Animación de ${name} pausada a la mitad`);
              }
            }, 100);
          }
        }
      });

      marker.addEventListener("markerLost", () => {
        console.log(`⚠ Marcador perdido: ${name}`);

        // 🚫 No desaparece el modelo
        model.setAttribute("visible", true);

        if (currentModel === model) {
          animationPaused = true;
          clock.stop();

          const currentPos = currentModel.object3D.position.clone();
          const targetPos = currentPos.clone();
          targetPos.y -= 0.1;
          smoothTarget = targetPos;

          lostTimeout = setTimeout(() => {
            if (currentModel === model) {
              console.log(`⏹ Marcador ${name} no detectado por 4s → reinicio`);
              needsReset = true;
              currentMixer = null;
              currentAction = null;
              clock.stop();
              animationPaused = false;
              brandInfo.style.display = "none";
              overlay.style.display = "none";
            }
          }, 4000);
        }
      });
    });

    btnYes.addEventListener("click", () => {
      if (currentMixer && currentAction) {
        console.log("▶ Continuando animación hasta el final...");
        animationPaused = false;
        clock.start();

        const checkEnd = setInterval(() => {
          if (currentAction.time >= currentAction.getClip().duration) {
            clearInterval(checkEnd);
            animationPaused = true;
            clock.stop();
            result.textContent = "💸 Has hecho una compra impulsiva (-10 salud mental)";
            setTimeout(() => overlay.style.display = "none", 2500);
          }
        }, 100);
      }
    });

    btnNo.addEventListener("click", () => {
      overlay.style.display = "none";
      result.textContent = "🙂 Decidiste no comprar";
    });
  </script>
</body>
</html>
