<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marcadores con Animación GLB — MindAR</title>

    <!-- A-Frame + MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #info {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: sans-serif;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 16px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="info">Esperando marcador...</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets/target.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Cámara -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Luces -->
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 1 1"></a-entity>

      <!-- === MARCADORES Y MODELOS === -->
      <a-entity mindar-image-target="targetIndex: 0" id="target0">
        <a-entity id="model0" gltf-model="./models/meta.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 180 0" visible="false"></a-entity>
        <a-entity id="brillo0" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.4"
          material="color: #00ffff; opacity: 0.4; side: double; emissive: #00ffff"
          rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target1">
        <a-entity id="model1" gltf-model="./models/mcdonalds.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 180 0" visible="false"></a-entity>
        <a-entity id="brillo1" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.4"
          material="color: #ffcc00; opacity: 0.4; side: double; emissive: #ffcc00"
          rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2" id="target2">
        <a-entity id="model2" gltf-model="./models/netflix.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 180 0" visible="false"></a-entity>
        <a-entity id="brillo2" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.4"
          material="color: #ff0000; opacity: 0.4; side: double; emissive: #ff0000"
          rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3" id="target3">
        <a-entity id="model3" gltf-model="./models/nike.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 180 0" visible="false"></a-entity>
        <a-entity id="brillo3" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.4"
          material="color: #ffffff; opacity: 0.4; side: double; emissive: #ffffff"
          rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4" id="target4">
        <a-entity id="model4" gltf-model="./models/alphabet.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 180 0" visible="false"></a-entity>
        <a-entity id="brillo4" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.4"
          material="color: #00ff00; opacity: 0.4; side: double; emissive: #00ff00"
          rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5" id="target5">
        <a-entity id="model5" gltf-model="./models/cofremac2.glb" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 180 0" visible="false"></a-entity>
        <a-entity id="brillo5" geometry="primitive: ring; radiusInner: 0.2; radiusOuter: 0.4"
          material="color: #00ffff; opacity: 0.4; side: double; emissive: #00ffff"
          rotation="-90 0 0" position="0 0.01 0" visible="false"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const info = document.getElementById("info");
      const nombres = ["META", "MCDONALDS", "NETFLIX", "NIKE", "ALPHABET", "APPLE"];
      const activados = new Set();

      for (let i = 0; i < nombres.length; i++) {
        const target = document.getElementById(`target${i}`);
        const model = document.getElementById(`model${i}`);
        const brillo = document.getElementById(`brillo${i}`);

        if (!target || !model) continue;

        target.addEventListener("targetFound", () => {
          info.innerText = `🎯 Marcador detectado: ${nombres[i]}`;
          console.log(`Marcador ${nombres[i]} detectado`);

          if (!activados.has(i)) {
            activados.add(i);
            model.setAttribute("visible", "true");
            brillo.setAttribute("visible", "true");
            model.setAttribute("animation-mixer", "clip: *; loop: once; timeScale: 1");

            // Efecto visual del brillo
            brillo.setAttribute("animation__scale", {
              property: "scale",
              to: "2 2 2",
              dur: 1000,
              easing: "easeOutQuad",
            });
            brillo.setAttribute("animation__fade", {
              property: "material.opacity",
              to: 0,
              dur: 1500,
              delay: 800,
            });

            console.log(`🚀 Animación iniciada para ${nombres[i]}`);
          }
        });

        target.addEventListener("targetLost", () => {
          info.innerText = `Marcador perdido: ${nombres[i]} (la animación sigue)`;
          console.log(`ℹ️ ${nombres[i]} perdido, la animación continúa`);
        });
      }

      // Permisos de cámara
      window.addEventListener("load", async () => {
        try {
          await navigator.mediaDevices.getUserMedia({ video: true });
          console.log("🎥 Cámara lista");
        } catch (err) {
          alert("No se pudo acceder a la cámara. Revisa los permisos del navegador.");
        }
      });
    </script>
  </body>
</html>
